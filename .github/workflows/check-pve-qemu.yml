name: Check pve-qemu-kvm rebuild against Proxmox

# The provisioning scripts rebuild pve-qemu-kvm on a pinned stock release with
# extra QEMU fixes. When Proxmox publishes another release, this opens (or
# updates) one issue saying which of those fixes the new release carries.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/scripts/check-pve-qemu.sh"
      - ".github/workflows/check-pve-qemu.yml"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - id: check
        run: |
          set +e
          .github/scripts/check-pve-qemu.sh src/proxmoxsandbox/scripts/ec2/userdata.sh "$RUNNER_TEMP/report.md"
          rc=$?
          set -e
          [ "$rc" -le 1 ] || exit "$rc"
          echo "needs_action=$rc" >> "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/report.md" ]; then cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - if: steps.check.outputs.needs_action == '1' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "pve-qemu-kvm rebuild: Proxmox published a new release"
        run: |
          number=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq "map(select(.title == env.TITLE and (.pull_request | not)))[0].number // empty")
          if [ -n "$number" ]; then
            jq -Rs '{body: .}' "$RUNNER_TEMP/report.md" |
              gh api "repos/$GITHUB_REPOSITORY/issues/$number" -X PATCH --input - > /dev/null
          else
            jq -Rs --arg title "$TITLE" '{title: $title, body: .}' "$RUNNER_TEMP/report.md" |
              gh api "repos/$GITHUB_REPOSITORY/issues" -X POST --input - > /dev/null
          fi
